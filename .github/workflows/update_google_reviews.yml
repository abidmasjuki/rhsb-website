name: Automated 7-Day Google Reviews Sync

on:
  schedule:
    # Runs every Sunday at 00:00 UTC (Cheapest 7-Day Free Interval)
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Google Reviews Sync Script
        run: python scripts/sync_google_reviews.py

      - name: Commit and Push Changes if Updated
        run: |
          git config --global user.name "RPWP Review Bot"
          git config --global user.email "bot@rpwphealthcare.com"
          git add js/google_reviews.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cron): auto-update 5-star Google Map reviews [skip ci]" && git push)
