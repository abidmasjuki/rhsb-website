name: Automated Bi-Monthly Google Reviews Sync

on:
  schedule:
    # Runs on the 1st day of every 2nd month at 00:00 UTC (Once every 2 months)
    - cron: '0 0 1 */2 *'
  workflow_dispatch:

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies & Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests beautifulsoup4
          playwright install --with-deps chromium

      - name: Run Google Reviews Sync Script
        run: python scripts/sync_google_reviews.py

      - name: Commit and Push Changes if Updated
        run: |
          git config --global user.name "RPWP Review Bot"
          git config --global user.email "bot@rpwphealthcare.com"
          git add js/google_reviews.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cron): bi-monthly sync of verified external Google Map reviews [skip ci]" && git push)
